name: corx

# Local development stack: corx + Prometheus + Grafana + an OTLP collector.
#
# Usage:
#   docker compose up -d                 # boot everything in the background
#   curl http://localhost:8080/livez     # liveness check
#   open http://localhost:3000           # Grafana (admin / admin)
#   open http://localhost:9090           # Prometheus
#
# Override `FEATURES` to opt-in to TLS / mTLS / OTel inside the build:
#   FEATURES="tls otel" docker compose build

services:
  corx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FEATURES: ${FEATURES:-otel}
    image: corx:dev
    container_name: corx
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info,corx=debug}
      CORX_CONFIG: /etc/corx/config.toml
    volumes:
      - ./corx.example.toml:/etc/corx/config.toml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/corx", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: corx-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (collector self-metrics)

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: corx-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: corx-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data: {}
  grafana-data: {}
