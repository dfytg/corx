global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # corx itself: scrape the bin's /metrics endpoint.
  - job_name: corx
    static_configs:
      - targets: ["corx:8080"]
        labels:
          service: corx
          environment: dev
    metrics_path: /metrics

  # Collector self-metrics: useful for spotting export failures.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector
          environment: dev
