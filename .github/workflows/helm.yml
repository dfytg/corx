name: Helm chart

# Validate and (on tag pushes) publish the Helm chart hosted under
# `charts/corx`. The OCI registry is GHCR, matching the container image.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    name: Lint & test chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint charts/corx

      - name: Render with default values
        run: helm template release charts/corx --debug > /tmp/rendered.yaml

      - name: Render with ingress + autoscaling enabled
        run: |
          helm template release charts/corx --debug \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set serviceMonitor.enabled=true \
            > /tmp/rendered-extra.yaml

      - name: Validate Kubernetes manifests with kubeconform
        uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          kubeconform: v0.6.7
      - run: |
          # ServiceMonitor is a Prometheus Operator CRD; pull its schema from
          # the community CRD catalog so -strict validation can resolve it.
          kubeconform -strict -summary -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml /tmp/rendered-extra.yaml

  publish:
    name: Publish chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: helm package charts/corx -d /tmp

      - name: Push chart
        run: |
          set -euo pipefail
          chart_pkg=$(ls /tmp/corx-*.tgz)
          helm push "$chart_pkg" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
