# corx configuration reference.
# Layer order (increasing precedence): defaults → this file / CORX_CONFIG → CORX_* env → CLI.
# Nested env keys use `__`, e.g. CORX_SERVER__BIND=0.0.0.0:9000

[server]
bind = "0.0.0.0:8080"
workers = 0                       # 0 = number of CPU cores
graceful_shutdown = "30s"
http2 = true
# [server.tls]
# cert_path = "/etc/corx/cert.pem"
# key_path  = "/etc/corx/key.pem"

[limits]
max_request_body_bytes        = 10_485_760  # 10 MiB
max_request_header_bytes      = 32_768      # 32 KiB
max_response_body_bytes       = 52_428_800  # 50 MiB; 0 = unlimited
inflight_max                  = 1000        # process concurrency cap; 0 = off
request_timeout               = "60s"
connect_timeout               = "10s"
max_redirects                 = 5
allow_https_to_http_downgrade = false
redirect_policy               = "follow"    # follow | block | rewrite

[cors]
policy            = "reflect"               # wildcard | reflect | explicit
origins           = []                       # production: list trusted origins
# Production: keep false and populate `origins`. Demo only:
allow_any_origin  = false
allowed_methods   = ["GET", "HEAD", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
allowed_headers   = [
    "accept",
    "accept-language",
    "authorization",
    "content-language",
    "content-type",
    "x-requested-with",
    "x-request-id",
]
exposed_headers   = ["x-corx-status", "x-corx-target-url", "x-request-id"]
max_age               = "600s"
allow_credentials     = false
allow_private_network = false

[forwarded]
inject              = true
trust_inbound_xff   = false
inject_request_id   = true

[security]
require_header          = ["origin"]
block_methods           = ["CONNECT", "TRACE"]
remove_request_headers  = ["cookie", "cookie2"]
remove_response_headers = ["set-cookie", "set-cookie2"]
origin_blacklist        = []
origin_whitelist        = []
# require_client_binding = true   # refuse start without whitelist / bearer / mTLS

[security.preflight]
mode       = "enforce"   # enforce | open
rate_limit = true

[security.auth]
mode          = "none"   # none | bearer
bearer_tokens = []

[target]
mode       = "any_public"   # any_public | allowlist | denylist
hosts      = []             # exact or suffix (".example.com")
schemes    = ["https", "http"]
https_only = false

[circuit_breaker]
enabled            = true
failure_threshold  = 5
window             = "30s"
open_duration      = "30s"
half_open_max      = 1
count_5xx          = true
max_hosts          = 8192

[ssrf]
mode = { kind = "strict" }
allow_ipv6 = true
extra_blocked_cidrs   = []
extra_allowed_cidrs   = []

[rate_limit]
enabled  = true
max_keys = 16384

[rate_limit.origin]
rps                 = 50
burst               = 100
unlimited_patterns  = []

[rate_limit.ip]
rps                 = 30
burst               = 60
trusted_cidrs       = []

[rate_limit.target_host]
rps                 = 100
burst               = 200

[rate_limit.global]
rps   = 5000
burst = 10000

[upstream]
pool_max_idle_per_host = 32
pool_idle_timeout = "90s"
# Defaults to corx/<crate-version> when omitted from a minimal config.

[observability]
log_format = "json"
log_level  = "info"
metrics_endpoint = "/metrics"

[observability.otel]
enabled              = false
endpoint             = "http://otel-collector:4317"
protocol             = "grpc"
service_name         = "corx"
service_namespace    = ""
resource_attributes  = []
sample_ratio         = 0.1
