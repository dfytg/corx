## Default values for the corx Helm chart.
## See README.md and the schemas in `corx.example.toml` for context.

image:
  repository: ghcr.io/qntx/corx
  tag: ""              # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
  pullSecrets: []

## Number of pod replicas. corx is stateless, so scaling horizontally is
## linear and recommended for production.
replicaCount: 2

## Pod-level command override; use this to flip on subcommands like
## `["check"]` for one-shot validation jobs.
command: []
args: ["serve"]

## Service exposure. The OOTB ClusterIP works behind an Ingress; switch to
## LoadBalancer for direct exposure.
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: corx.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

## Liveness probes target the dedicated /livez endpoint, readiness targets
## /readyz so it flips to 503 the moment SIGTERM lands.
probes:
  liveness:
    enabled: true
    path: /livez
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 1

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 1
    memory: 256Mi

## Operator configuration. Rendered verbatim into a ConfigMap and mounted at
## /etc/corx/config.toml. Use a literal block string so operators can paste
## directly from `corx.example.toml`; Helm's stock template library does not
## ship a TOML serialiser so we keep the contract straightforward.
##
## To override individual fields, copy this block, edit it in your release
## values file, and re-render. For per-environment fan-out, prefer a
## `helmfile` / Argo CD parameterised values file.
configMetricsEndpoint: "/metrics"
config: |
  [server]
  bind = "0.0.0.0:8080"
  workers = 0
  graceful_shutdown = "30s"
  http2 = true

  [limits]
  max_request_body_bytes = 10485760
  max_request_header_bytes = 32768
  request_timeout = "60s"
  connect_timeout = "5s"
  max_redirects = 5
  allow_https_to_http_downgrade = false

  [cors]
  allow_credentials = false
  allow_private_network = false
  expose_headers = []
  max_age = "300s"

  [cors.policy]
  kind = "wildcard"

  [security]
  require_header = []
  block_methods = []
  remove_request_headers = []
  remove_response_headers = []
  origin_blacklist = []
  origin_whitelist = []

  [ssrf]
  mode = "strict"
  extra_blocked_cidrs = []
  extra_allowed_cidrs = []

  [forwarded]
  inject = true
  trust_inbound_xff = false
  inject_request_id = true

  [rate_limit]
  enabled = true

  [rate_limit.origin]
  rps = 50
  burst = 100
  unlimited_origins = []

  [rate_limit.ip]
  rps = 20
  burst = 40
  trusted_cidrs = []

  [rate_limit.target_host]
  rps = 100
  burst = 200

  [rate_limit.global]
  rps = 0
  burst = 0
  inflight_max = 1024

  [upstream]
  pool_max_idle_per_host = 32
  pool_idle_timeout = "90s"
  user_agent = "corx"

  [observability]
  log_format = "json"
  log_level = "info"
  metrics_endpoint = "/metrics"

  [observability.otel]
  enabled = false
  endpoint = "http://otel-collector:4317"
  protocol = "grpc"
  service_name = "corx"
  service_namespace = ""
  resource_attributes = []
  sample_ratio = 0.1

## Prometheus Operator integration. Disabled by default; flip on when
## `kube-prometheus-stack` (or similar) is installed in-cluster.
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

## Pod-level security context. The image already runs as the distroless
## `nonroot` user (uid 65532), but we re-state it here so PodSecurityPolicy
## / Pod Security Standards "restricted" admission accepts the deployment
## without bouncing it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

## Horizontal Pod Autoscaler. Disabled by default to keep the chart
## minimal; flip on for production where the load profile is bursty.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

## Pod Disruption Budget. Recommended for production -- prevents node
## drains from taking out every replica simultaneously.
pdb:
  enabled: false
  minAvailable: 1
